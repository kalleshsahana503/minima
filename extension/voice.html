<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minima · Microphone</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 0%,#14224a,#070b18);color:#EAF0FF;font:16px/1.5 system-ui,"Segoe UI",sans-serif}
  main{width:min(520px,92vw);text-align:center;padding:28px}
  .orb{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2DE2B0,#38BDF8 55%,#8B5CF6);box-shadow:0 0 50px rgba(56,189,248,.55)}
  h1{font-size:22px;margin:0 0 6px}
  #state{color:#9fe9d6;font-weight:600;min-height:26px}
  p{color:#97A0C6;font-size:14px}
  button{margin-top:14px;padding:11px 20px;border-radius:12px;border:0;font:700 15px inherit;color:#04101c;cursor:pointer;background:linear-gradient(120deg,#2DE2B0,#38BDF8 55%,#8B5CF6)}
  .meter{width:min(320px,80%);height:10px;margin:14px auto 6px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2DE2B0,#38BDF8);transition:width .08s}
  .small{font-size:13px;color:#97A0C6;min-height:20px}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <div class="orb"></div>
  <h1>Minima needs your microphone (one time)</h1>
  <div id="state">Checking…</div>
  <button id="allow" class="hidden">Allow the microphone</button>
  <button id="stt" class="hidden">Test speech: say “hello Minima”</button>
  <div id="heard" class="small"></div>
  <div class="meter"><i id="lvl"></i></div>
  <div id="mic" class="small"></div>
  <p id="help">After you allow it, this page closes by itself. From then on Minima listens quietly in the background:
  just say <b>“Hey Minima”</b> on any website. The green bar moves when she hears you.</p>
</main>
<script src="shared.js"></script>
<script src="voice.js"></script>
</body>
</html>
